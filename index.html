<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>stopcinning</title>
<style>
:root{--c:#22d3ee;--b:#3b82f6;--p:#a78bfa;--bg:#0a0e14;--d:#4b5563}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:#c9d1d9;font:15px/1.5 ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace;overflow-x:hidden;cursor:crosshair}
#c{position:fixed;inset:0;z-index:0}
body:after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 4px)}
main{position:relative;z-index:2}
section{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 18px}
.box{position:relative;background:var(--bg);border:1px solid rgba(34,211,238,.55);outline:1px solid rgba(34,211,238,.2);outline-offset:4px}
.tt{position:absolute;top:-11px;left:14px;background:var(--bg);padding:0 8px;color:var(--c);font-size:13px}
.tr{position:absolute;top:-11px;right:14px;background:var(--bg);padding:0 8px;color:var(--p);font-size:13px}
#hero .box{padding:40px 34px 30px;max-width:780px;width:100%}
pre.art{font-size:clamp(6px,1.45vw,14px);line-height:1.05;letter-spacing:0;white-space:pre;overflow:hidden;user-select:none}
pre.art span{display:block;transition:transform .08s}
.boot{color:var(--d);font-size:13px;margin-bottom:18px}.boot b{color:#22c55e;font-weight:400}
.type{margin-top:22px;font-size:clamp(14px,3vw,20px)}.type i{color:var(--c);font-style:normal}
.cur{display:inline-block;width:.6em;height:1.1em;background:var(--c);vertical-align:-.2em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.stat{margin-top:24px;padding-top:14px;border-top:1px dashed var(--d);color:#9ca3af;display:flex;flex-wrap:wrap;gap:6px 26px;font-size:14px}
.stat b{color:var(--c);font-weight:400}.stat em{font-style:normal;color:#22c55e}
.hint{margin-top:26px;font-size:13px;color:var(--d)}
h2{font-size:14px;letter-spacing:.15em;color:var(--c);margin-bottom:28px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:26px;max-width:980px;width:100%}
a.box{display:block;padding:22px 20px 16px;color:inherit;text-decoration:none;transition:background .1s}
a.box h3{font-size:17px;color:#fff;font-weight:400}a.box h3:before{content:"> ";color:var(--c)}
a.box p{font-size:13px;color:#9ca3af;margin:8px 0 14px;min-height:2.9em}.meta{font-size:12px;color:var(--p)}
a.box:hover{background:var(--c)}a.box:hover *{color:var(--bg)!important}
.btn{margin-top:34px;color:var(--c);text-decoration:none;font-size:14px}.btn:hover{background:var(--c);color:var(--bg)}
footer{position:relative;z-index:2;text-align:center;padding:40px 18px 70px;color:var(--d);font-size:14px}footer b{color:var(--c)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<main>
<section id="hero">
  <div class="box">
    <span class="tt">[ stopcinning@github ]</span><span class="tr">[v1.0]</span>
    <div class="boot">&gt; loading stopcinning .......... <b>[ ok ]</b></div>
    <pre class="art" id="art"></pre>
    <div class="type"><i>$</i> <span id="t"></span><span class="cur"></span></div>
    <div class="stat"><span>repos: <b id="repos">-</b></span><span>followers: <b id="fol">-</b></span><span>commissions: <em>open</em></span></div>
  </div>
  <p class="hint">[ move cursor ] [ click to ripple ]</p>
</section>
<section id="repos-s">
  <h2>// ls -t ~/repos</h2>
  <div class="grid" id="grid"><div class="box" style="padding:22px">loading...</div></div>
  <a class="btn" href="https://github.com/stopcinning">[ github.com/stopcinning ]</a>
</section>
</main>
<footer>// end of file <b>_</b></footer>
<script>
const U='stopcinning';
// ascii title
const G={s:[" ████","█    "," ███ ","    █","████ "],t:["█████","  █  ","  █  ","  █  ","  █  "],o:[" ███ ","█   █","█   █","█   █"," ███ "],p:["████ ","█   █","████ ","█    ","█    "],c:[" ████","█    ","█    ","█    "," ████"],i:["█████","  █  ","  █  ","  █  ","█████"],n:["█   █","██  █","█ █ █","█  ██","█   █"],g:[" ████","█    ","█  ██","█   █"," ████"]};
const rc=['#22d3ee','#33b5f0','#3b82f6','#6d6ff5','#a78bfa'],art=document.getElementById('art');
for(let r=0;r<5;r++){const s=document.createElement('span');s.style.color=rc[r];s.textContent=[...'stopcinning'].map(ch=>G[ch][r]).join(' ');art.append(s)}
art.addEventListener('pointermove',()=>[...art.children].forEach(s=>{s.style.transform=`translateX(${(Math.random()-.5)*6}px)`;setTimeout(()=>s.style.transform='',90)}));
// ascii field
const cv=document.getElementById('c'),x=cv.getContext('2d'),R=' .:-=+*#%@',rip=[],M={x:-999,y:-999};
let W,H,D,cw=13,ch=19;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);x.font='14px ui-monospace,Menlo,Consolas,monospace';x.textBaseline='middle'}
rs();addEventListener('resize',rs);
addEventListener('pointermove',e=>{M.x=e.clientX;M.y=e.clientY});
addEventListener('pointerdown',e=>rip.push({x:e.clientX,y:e.clientY,t:performance.now()}));
function frame(now){
  const t=now/1000;x.clearRect(0,0,W,H);
  while(rip.length&&now-rip[0].t>2200)rip.shift();
  for(let r=0;r<H/ch+1;r++)for(let c=0;c<W/cw+1;c++){
    const px=c*cw+cw/2,py=r*ch+ch/2;
    let v=.2+.1*(Math.sin(c*.17+t*.8)+Math.sin(r*.23-t*.6));
    const dx=px-M.x,dy=py-M.y;v+=Math.exp(-(dx*dx+dy*dy)/18000)*.95;
    for(const p of rip){const a=(now-p.t)/1000,d=Math.hypot(px-p.x,py-p.y),q=d-a*430;v+=Math.exp(-q*q/700)*Math.max(0,1-a/2.1)}
    const i=Math.min(9,Math.max(0,v*10|0));if(!i)continue;
    x.fillStyle=v<.3?'#1b2f4a':v<.55?'#22d3ee':v<.85?'#3b82f6':'#a78bfa';x.globalAlpha=v<.3?.8:Math.min(1,.45+v*.5);
    x.fillText(R[i],px-4,py)}
  x.globalAlpha=1;requestAnimationFrame(frame)}
requestAnimationFrame(frame);
// typing
const ph=['commissions open','small jobs welcome'],te=document.getElementById('t');let pi=0,ci=0,del=0;
(function ty(){const s=ph[pi];ci+=del?-1:1;te.textContent=s.slice(0,ci);let d=del?35:70;
  if(!del&&ci===s.length){del=1;d=1500}else if(del&&ci===0){del=0;pi=(pi+1)%ph.length;d=300}setTimeout(ty,d)})();
// live github
function count(id,n){const e=document.getElementById(id);let c=0;const st=Math.max(1,Math.ceil(n/30));const iv=setInterval(()=>{c=Math.min(n,c+st);e.textContent=c;if(c>=n)clearInterval(iv)},30)}
fetch(`https://api.github.com/users/${U}`).then(r=>r.json()).then(u=>{count('repos',u.public_repos||0);count('fol',u.followers||0)}).catch(()=>{});
const g=document.getElementById('grid');
fetch(`https://api.github.com/users/${U}/repos?sort=pushed&per_page=6`).then(r=>r.json()).then(rs=>{
  rs=rs.filter(r=>!r.fork);
  if(!rs.length){g.innerHTML='<div class="box" style="padding:22px">no public repos yet. first one shows up here by itself.</div>';return}
  g.innerHTML='';rs.forEach(r=>{
    const a=document.createElement('a');a.className='box';a.href=r.html_url;a.target='_blank';
    const days=Math.max(0,Math.floor((Date.now()-new Date(r.pushed_at))/864e5));
    const h=document.createElement('h3');h.textContent=r.name;
    const p=document.createElement('p');p.textContent=r.description||'no description yet';
    const m=document.createElement('div');m.className='meta';m.textContent=`${r.language||'-'}  |  * ${r.stargazers_count}  |  ${days}d ago`;
    a.append(h,p,m);g.append(a)})
}).catch(()=>{g.innerHTML='<div class="box" style="padding:22px">github said no. refresh in a bit.</div>'});
</script>
</body>
</html>
